name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso a gradlew
        run: chmod +x gradlew

      # Cuando existan los proyectos de Firebase, guarda el JSON como secret (en base64) y
      # descomenta esto para que el plugin google-services se aplique en el CI:
      # - name: Escribir google-services.json
      #   run: echo "${{ secrets.GOOGLE_SERVICES_DEV }}" | base64 -d > androidApp/src/dev/google-services.json

      - name: Tests unitarios (código compartido)
        run: ./gradlew :shared:testDebugUnitTest

      - name: Lint
        run: ./gradlew :androidApp:lintDevDebug

      - name: Compilar APK de desarrollo
        run: ./gradlew :androidApp:assembleDevDebug

      - name: Subir reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            shared/build/reports/
            androidApp/build/reports/

  # TODO(iOS): agregar un job con `runs-on: macos-latest` que compile el framework y la app de
  # Xcode cuando exista iosApp/iosApp.xcodeproj (ver iosApp/README.md).
